server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 200
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: webox-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/webox?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:webox}
    password: ${DB_PASSWORD:webox_pwd}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/V1__schema.sql
      data-locations: classpath:db/V2__seed.sql
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

webox:
  jwt-secret: ${JWT_SECRET:}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:30}
  refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081}
  menu-cache-ttl-seconds: ${MENU_CACHE_TTL_SECONDS:30}
  llm-base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  llm-api-key: ${LLM_API_KEY:}
  llm-model: ${LLM_MODEL:gpt-4o-mini}
  upload-dir: ${UPLOAD_DIR:/app/uploads}

logging:
  level:
    root: INFO
    com.webox: INFO
    org.hibernate.SQL: WARN
